<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Sideswipe</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--cy:#25d9ff;--or:#ff7a2e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050816;color:#eaf0ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
canvas{width:min(100vw,calc((100vh - 70px)*2));height:auto;border-radius:14px;box-shadow:0 0 0 2px #1b2a6b,0 0 60px rgba(37,217,255,.18),0 0 120px rgba(255,122,46,.1)}
button{font:inherit;cursor:pointer;color:inherit}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,rgba(20,30,90,.72),rgba(3,5,18,.94));backdrop-filter:blur(6px);transition:opacity .45s,visibility .45s}
.ov::before,.ov::after{content:"";position:absolute;width:440px;height:440px;border-radius:50%;opacity:.2;animation:drift 9s ease-in-out infinite alternate;pointer-events:none}
.ov::before{background:radial-gradient(var(--cy),transparent 70%);left:-140px;top:-120px}
.ov::after{background:radial-gradient(var(--or),transparent 70%);right:-140px;bottom:-120px;animation-delay:-4s}
@keyframes drift{to{transform:translate(120px,80px) scale(1.2)}}
.hid{opacity:0;visibility:hidden;pointer-events:none}
.card{position:relative;width:min(92vw,460px);padding:26px;text-align:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}}
.logo{font-size:clamp(42px,12vw,68px);font-weight:900;font-style:italic;letter-spacing:-1px;line-height:.95;background:linear-gradient(90deg,var(--cy),#fff,var(--or),var(--cy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,float 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(37,217,255,.45))}
.logo span{display:block;font-size:.4em;letter-spacing:.55em;font-style:normal;margin-bottom:4px}
@keyframes shine{to{background-position:300% 0}}
@keyframes float{50%{transform:translateY(-8px)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0 16px}
.seg button{padding:14px 8px;border-radius:14px;border:2px solid #25356f;background:rgba(20,30,80,.5);font-weight:800;transition:.2s}
.seg button:hover{transform:translateY(-2px)}
.seg .on{border-color:var(--cy);background:rgba(37,217,255,.15);box-shadow:0 0 22px rgba(37,217,255,.35)}
.dh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
#diff{width:100%;accent-color:var(--cy)}
.keys{margin:16px 0 20px;font-size:13px;opacity:.9;line-height:1.9}
kbd{background:#16225a;border:1px solid #34478f;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font:700 12px monospace}
.big{width:100%;padding:16px;border:0;border-radius:16px;font-size:22px;font-weight:900;letter-spacing:2px;color:#041022;background:linear-gradient(90deg,var(--cy),#8cf0ff);animation:pulse 1.6s infinite;transition:transform .15s}
.big:hover{transform:scale(1.04)}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(37,217,255,.5)}50%{box-shadow:0 0 46px rgba(37,217,255,.95)}}
.sec{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:2px solid #25356f;background:rgba(20,30,80,.6);font-weight:800}
#et{font-size:clamp(38px,10vw,60px);font-weight:900;font-style:italic;margin:0;animation:float 2s ease-in-out infinite}
#es{font-size:54px;font-weight:900;margin:6px 0 22px;letter-spacing:6px}
#mu{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid #34478f;background:rgba(10,16,48,.8)}
.pad{display:flex;gap:8px}
.pad button{padding:14px 20px;border-radius:12px;border:1px solid #34478f;background:#111b4a;font-weight:800;touch-action:none;user-select:none}
.pad button:active{background:#25356f}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
.ov{align-items:flex-start}.card{margin:auto}
.seg{grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none;margin:4px 0 12px}
.lb{text-align:left;font-size:11px;letter-spacing:.2em;opacity:.7;font-weight:800;margin-top:6px}
.card.book{width:min(94vw,720px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tabs button{padding:8px 14px;border-radius:10px;border:2px solid #25356f;background:rgba(20,30,80,.5);font-weight:800}
.tabs .on{border-color:var(--or);background:rgba(255,122,46,.18)}
#pg{text-align:left;max-height:56vh;overflow:auto;padding:14px 18px;border-radius:14px;background:rgba(10,16,48,.7);border:1px solid #25356f;font-size:14px;line-height:1.6;animation:pg .4s}
@keyframes pg{from{opacity:0;transform:perspective(600px) rotateY(-25deg) translateX(20px)}}
#pg h3{margin:14px 0 4px;color:var(--cy)}#pg h3:first-child{margin-top:0}
#pg table{width:100%;border-collapse:collapse}#pg td,#pg th{padding:5px 8px;border-bottom:1px solid #25356f;text-align:left}
#man{z-index:8}
#hm{width:300px;max-width:80%;border-radius:10px;filter:blur(1.2px)}
#bk{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:56px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid #34478f;background:rgba(10,16,48,.8)}
.row{display:flex;gap:8px}.row .sec{margin-top:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 12px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw .on{border-color:#fff;box-shadow:0 0 14px currentColor}
#pv{background:rgba(10,16,48,.6);border-radius:12px;margin:6px 0}
#gar{z-index:8}#pause{z-index:7}
#ps{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:102px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid #34478f;background:rgba(10,16,48,.8)}
</style></head><body>
<canvas id="c" width="1000" height="500"></canvas>
<div class="pad"><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="j">SALTO</button><button data-k="b">TURBO</button></div>
<button id="ps">⏸</button><button id="bk">📖</button><button id="mu">🔊</button>

<div id="menu" class="ov"><div class="card">
 <div class="logo"><span>NEON</span>SIDESWIPE</div>
 <div class="lb">FORMATO</div><div class="seg"><button data-g="fmt" data-v="1v1">1 vs 1</button><button data-g="fmt" data-v="2v2">2 vs 2</button></div>
 <div class="lb">VARIANTE</div><div class="seg"><button data-g="vr" data-v="cl">⚽ CLÁSICO</button><button data-g="vr" data-v="heat">🔥 HEATSEEKER</button><button data-g="vr" data-v="bask">🏀 BALONCESTO</button></div>
 <div class="lb">DURACIÓN</div><div class="seg"><button data-g="dur" data-v="30">30 s</button><button data-g="dur" data-v="60">1:00</button><button data-g="dur" data-v="120">2:00</button><button data-g="dur" data-v="300">5:00</button></div>
 <div class="lb">JUGADORES HUMANOS</div><div class="seg" id="nh"></div>
 <div id="tmr"><div class="lb">EQUIPOS</div><div class="seg"><button data-g="tm" data-v="1">🤝 Juntos vs bots</button><button data-g="tm" data-v="0">⚔️ Mezclados</button></div></div>
 <div id="dl"><div class="dh"><span>Dificultad bots</span><b id="dn">Difícil · 50</b></div><input type="range" id="diff" min="1" max="100" value="50"></div>
 <div class="keys" id="keys"></div>
 <button id="go" class="big">¡JUGAR!</button>
 <div class="row"><button id="mb" class="sec">📖 MANUAL</button><button id="mg" class="sec">🎨 GARAJE</button></div>
</div></div>

<div id="end" class="ov hid"><div class="card">
 <h2 id="et"></h2><div id="es"></div>
 <canvas id="hm" width="300" height="150"></canvas><div class="lb" style="text-align:center;margin-bottom:14px">MAPA DE CALOR · dónde estuvo el balón</div>
 <button id="again" class="big">REVANCHA</button>
 <button id="back" class="sec">MENÚ</button>
</div></div>

<div id="gar" class="ov hid"><div class="card book"><h2 style="margin:0 0 8px;font-style:italic">🎨 GARAJE</h2>
<div class="tabs" id="gs"></div><canvas id="pv" width="200" height="120"></canvas>
<div class="lb">COLOR (EQ = color de equipo)</div><div class="sw" id="gc"></div>
<div class="lb">CARROCERÍA</div><div class="seg" id="gb"></div>
<div class="lb">ESTELA DE TURBO</div><div class="seg" id="gf"></div>
<button class="big" id="gx">LISTO ✓</button></div></div>
<div id="pause" class="ov hid"><div class="card"><h2 style="margin:0 0 18px;font-style:italic;font-size:46px">⏸ PAUSA</h2>
<button class="big" id="pr">REANUDAR</button><button class="sec" id="prs">🔄 REINICIAR</button><button class="sec" id="pm">📖 MANUAL</button><button class="sec" id="pq">🏠 MENÚ</button></div></div>
<div id="man" class="ov hid"><div class="card book"><div class="tabs" id="tabs"></div><div id="pg"></div><button class="sec" id="mc">CERRAR ✕</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c');let g=cv.getContext('2d');
const W=900,H=500,OX=50,F=H-40,GH=150,R=22,TAU=6.2832,CY='#25d9ff',OR='#ff7a2e';
const KS=[{},{},{},{}],JS=[false,false,false,false],cfg={fmt:'1v1',vr:'cl',nh:1,tm:'1',dur:'120'};
let cars=[],TN=['AZUL','NARANJA'],HM=new Uint16Array(1250),paused=false,D=50,state='menu',ball,score=[0,0],time=0,ot=false,msgT=0,msg='',cnt=0,goT=0,banT=0,last=0,acc=0,T=0,sh=0,fl=0,muted=false,PT=[],gl=[0,0],AC;

/* ---------- sound ---------- */
function sfx(f,d=.1,type='square',v=.05,f2){
 if(muted)return;
 try{AC=AC||new(window.AudioContext||webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),n=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n).connect(AC.destination);o.start();o.stop(t+d)}catch(e){}
}

/* ---------- input ---------- */
const MS=[{KeyA:'l',KeyD:'r',KeyW:'j',KeyS:'b',ShiftLeft:'b'},{ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',ArrowDown:'b',ShiftRight:'b'},{KeyJ:'l',KeyL:'r',KeyI:'j',KeyK:'b'},{Numpad4:'l',Numpad6:'r',Numpad8:'j',Numpad5:'b',Numpad2:'b'}];
function press(i,k,v){const K=KS[i];if(k=='j'&&v&&!K.j)JS[i]=true;K[k]=v}
addEventListener('keydown',e=>{
 const sp=e.code=='Space'||e.code=='Enter';let h=sp;
 MS.forEach((m,i)=>{if(m[e.code]){h=true;press(i,m[e.code],true)}});
 if(h)e.preventDefault();
 if(e.code=='Escape'||e.code=='KeyP'){if(ga)closeGar();else if(mo)toggleMan(false);else togglePause()}
 if(sp&&!mo){if(state=='replay')endReplay();else if(state=='menu'||state=='over')startGame();else if(cfg.nh==1&&e.code=='Space')press(0,'j',true)}
});
addEventListener('keyup',e=>{MS.forEach((m,i)=>{if(m[e.code])press(i,m[e.code],false)});if(e.code=='Space')press(0,'j',false)});
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();press(0,k,true)});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>press(0,k,false)));
});

/* ---------- menu ---------- */
const dname=d=>d<25?'Novato':d<50?'Fácil':d<75?'Difícil':d<95?'Experto':'Imposible';
let mo=false;
const NB=()=>cfg.fmt=='1v1'?2-cfg.nh:4-cfg.nh;
const KN=['<kbd>W A D</kbd> · turbo <kbd>S</kbd>','<kbd>← ↑ →</kbd> · turbo <kbd>↓</kbd>','<kbd>J I L</kbd> · turbo <kbd>K</kbd>','<kbd>4 8 6</kbd> · turbo <kbd>5</kbd> (teclado numérico)'];
function refresh(){
 const mx=cfg.fmt=='1v1'?2:4;if(cfg.nh>mx)cfg.nh=mx;
 $('nh').innerHTML=Array.from({length:mx},(_,i)=>'<button data-g="nh" data-v="'+(i+1)+'">'+(i+1)+' 👤</button>').join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',cfg[b.dataset.g]==b.dataset.v));
 $('dl').style.display=NB()>0?'':'none';
 $('tmr').style.display=cfg.fmt=='2v2'&&cfg.nh==2?'':'none';
 $('keys').innerHTML=(cfg.nh==1?'<div><kbd>W A D</kbd> o <kbd>← ↑ →</kbd> · <kbd>Espacio</kbd> salta · turbo <kbd>S</kbd>/<kbd>↓</kbd></div>':KN.slice(0,cfg.nh).map((k,i)=>'<div><b>J'+(i+1)+'</b> '+k+'</div>').join(''))+'<div>En el aire: salto + dirección = <b>voltereta</b></div>';
}
$('menu').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;cfg[b.dataset.g]=b.dataset.v;refresh();reset();sfx(500,.06,'square',.04)});
$('diff').oninput=e=>{D=+e.target.value;$('dn').textContent=dname(D)+' · '+D};
$('diff').onchange=()=>$('diff').blur();
$('go').onclick=()=>{$('go').blur();startGame()};
$('again').onclick=startGame;
$('back').onclick=()=>{state='menu';$('end').classList.add('hid');$('menu').classList.remove('hid');reset()};
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊';$('mu').blur()};
let po=false,ga=false,gsl=0,pcar,REC=[],RP=[],ri=0;
const COL=[null,'#ff3b6b','#ffd23a','#3aff8a','#b27bff','#ffffff','#ff9a2e','#25d9ff'];
const FL=[['#ffd23a','#ff5a1f'],['#e8fbff','#25d9ff'],['#b6ff6a','#1fd16a'],['#ff9bf0','#8a4bff']];
const ST=[null,{p:[[-32,8],[-32,-2],[-24,-7],[-6,-9],[2,-14],[14,-14],[24,-8],[34,-3],[34,8]],w:[[-2,-9],[3,-12.5],[11,-12.5],[18,-8]]},{p:[[-32,8],[-32,-17],[8,-17],[18,-9],[34,-6],[34,8]],w:[[-26,-14],[6,-14],[13,-9],[-26,-9]]}];
let GAR=[0,1,2,3].map(()=>({col:null,body:0,fl:0}));
try{const sv=JSON.parse(localStorage.getItem('ns_gar'));if(sv&&sv.length==4)GAR=sv}catch(_){}
const dk=h=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*.5).toString(16).padStart(2,'0')).join('');
function rGar(){
 const q=GAR[gsl];
 $('gs').innerHTML=[0,1,2,3].map(i=>'<button data-s="'+i+'" class="'+(i==gsl?'on':'')+'">J'+(i+1)+'</button>').join('');
 $('gc').innerHTML=COL.map((c,i)=>'<button data-c="'+i+'" class="'+(q.col==c?'on':'')+'" style="background:'+(c||'linear-gradient(90deg,#25d9ff,#ff7a2e)')+';color:'+(c||'#fff')+'"></button>').join('');
 $('gb').innerHTML=['Clásico','Deportivo','Furgón'].map((n,i)=>'<button data-b="'+i+'" class="'+(q.body==i?'on':'')+'">'+n+'</button>').join('');
 $('gf').innerHTML=['🔥 Fuego','❄️ Hielo','☣️ Veneno','🔮 Violeta'].map((n,i)=>'<button data-f="'+i+'" class="'+(q.fl==i?'on':'')+'">'+n+'</button>').join('');
 pcar=mk(0,1,q.col||CY,q.col?dk(q.col):'#0a6cff',7,'');pcar.tc=CY;pcar.body=q.body;pcar.fx=FL[q.fl];
}
function closeGar(){ga=false;$('gar').classList.add('hid');reset()}
function drawPrev(){
 const og=g,x=$('pv').getContext('2d'),y=66+Math.sin(T*.05)*3;g=x;x.clearRect(0,0,200,120);
 pcar.wr+=.1;x.save();x.translate(100,y);x.scale(1.8,1.8);drawCar(pcar);x.restore();
 [0,1].forEach(k=>{x.fillStyle=pcar.fx[k];x.beginPath();x.arc(34-k*12,y+10,7-k*2,0,TAU);x.fill()});
 g=og;
}
$('gar').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset,q=GAR[gsl];
 if(d.s!==undefined)gsl=+d.s;if(d.c!==undefined)q.col=COL[+d.c];if(d.b!==undefined)q.body=+d.b;if(d.f!==undefined)q.fl=+d.f;
 try{localStorage.setItem('ns_gar',JSON.stringify(GAR))}catch(_){}
 if(b.id=='gx')closeGar();else{rGar();sfx(550,.05,'square',.03)}
};
$('mg').onclick=()=>{ga=true;$('gar').classList.remove('hid');rGar()};
function togglePause(v){if(state=='menu'||state=='over'||ga)return;po=v===undefined?!po:v;$('pause').classList.toggle('hid',!po);paused=po||mo;JS.fill(false)}
$('ps').onclick=()=>{$('ps').blur();togglePause()};
$('pr').onclick=()=>togglePause(false);$('prs').onclick=()=>startGame();$('pm').onclick=()=>toggleMan(true);
$('pq').onclick=()=>{po=false;paused=false;$('pause').classList.add('hid');state='menu';$('menu').classList.remove('hid');reset()};
cv.onclick=()=>{if(state=='replay')endReplay()};
const TB='<table><tr><th>Jugador</th><th>Mover / inclinar</th><th>Saltar</th><th>Turbo</th></tr>';
const PGS={
reglas:['📜 Reglas',`<h3>Objetivo</h3><p>Dos equipos: <b style="color:var(--cy)">AZUL</b> (izquierda) y <b style="color:var(--or)">NARANJA</b> (derecha). Mete el balón en la portería rival.</p>
<h3>Partido</h3><p>Dura lo que elijas (<b>30 s · 1:00 · 2:00 · 5:00</b>). Gana quien tenga más goles. Si hay empate: <b>prórroga con gol de oro</b> (el siguiente gol gana). Tras cada gol hay cuenta atrás 3-2-1 y saque central.</p>
<h3>Movimiento</h3><p><b>Saltar:</b> un toque. <b>Voltereta:</b> segundo salto en el aire manteniendo una dirección; da impulso y golpea el balón más fuerte. Sin dirección, es un mini salto extra.</p>
<p><b>Turbo:</b> empuja hacia donde apunta el morro (en el aire, inclina el coche con izquierda/derecha para dirigirlo). La barra se gasta y se recarga despacio.</p>
<p>Los coches no chocan entre sí, solo con el balón. Aterriza sobre las ruedas para recuperar el control.</p>`],
controles:['🎮 Controles',TB+`<tr><td>J1</td><td>A D</td><td>W</td><td>S o Shift izq.</td></tr><tr><td>J2</td><td>← →</td><td>↑</td><td>↓ o Shift der.</td></tr><tr><td>J3</td><td>J L</td><td>I</td><td>K</td></tr><tr><td>J4</td><td>4 6 (teclado numérico)</td><td>8</td><td>5 o 2</td></tr></table>
<h3>Según el caso</h3><p><b>1 humano:</b> usa WASD <i>o</i> flechas, y Espacio para saltar (ignora J2).</p><p><b>2 o más humanos:</b> cada uno usa su juego de teclas (J1, J2...). Se asignan por orden a los coches humanos.</p><p><b>Móvil:</b> botones en pantalla (solo J1).</p>
<h3>Otros</h3><p><kbd>Espacio</kbd> / <kbd>Enter</kbd> empieza o repite. <kbd>Esc</kbd> o <kbd>P</kbd> pausan (reanudar, reiniciar o menú). 📖 abre el manual (pausa); 🔊 silencia. Tras cada gol hay repetición en cámara lenta: <kbd>Espacio</kbd> o clic para saltarla.</p><p>Con 3-4 jugadores en un mismo teclado, algunos teclados no detectan tantas teclas a la vez.</p>`],
modos:['🧩 Modos',`<h3>1 vs 1</h3><p>1 humano vs bot (dificultad 1-100) · 2 humanos: J1 (azul) vs J2 (naranja).</p>
<h3>2 vs 2</h3><table><tr><th>Humanos</th><th>Azul</th><th>Naranja</th></tr><tr><td>1</td><td>J1 + bot</td><td>2 bots</td></tr><tr><td>2 juntos</td><td>J1 + J2</td><td>2 bots</td></tr><tr><td>2 mezclados</td><td>J1 + bot</td><td>J2 + bot</td></tr><tr><td>3</td><td>J1 + J2</td><td>J3 + bot</td></tr><tr><td>4</td><td>J1 + J2</td><td>J3 + J4</td></tr></table>
<p>Los bots compañeros se reparten: uno ataca y el otro defiende cuando el balón está lejos de su portería.</p>
<h3>🏀 Baloncesto</h3><p>No hay porterías: hay un aro en cada pared, en el aire. Mete el balón <b>desde arriba</b> por el aro rival (cuenta 1 punto). El aro azul está a la izquierda y el naranja a la derecha. Los bordes del aro rebotan el balón. Los bots son más simples aquí.</p>
<h3>🔥 Heatseeker</h3><p>Al tocar el balón, éste se "calienta": se bloquea hacia la portería <b>contraria al que lo tocó</b>, sin gravedad, y acelera con cada toque (hasta un máximo). Para salvarte, tócalo: se invierte y apunta a la portería rival. El primer toque del saque es el que lo lanza.</p>`],
trucos:['💡 Trucos',`<h3>Consejos</h3><p>• Salta y haz voltereta justo antes de llegar al balón para pegarle fuerte.<br>• Guarda turbo para defender y para los saques.<br>• En el aire, inclínate para aterrizar sobre las ruedas.<br>• En Heatseeker, no esperes: despeja el balón antes de que coja velocidad.</p>
<h3>Dificultad de los bots</h3><p>Afecta a su reacción, velocidad y precisión. Desde 20 usan turbo y desde 35 hacen volteretas.</p>
<h3>Garaje</h3><p>En el menú, 🎨 GARAJE: color, carrocería (clásico, deportivo, furgón) y estela del turbo para cada jugador J1-J4. Se guarda en tu navegador.</p><h3>Mapa de calor</h3><p>Al terminar cada partido ves un mapa con las zonas donde más estuvo el balón (azul = poco, rojo = mucho).</p>`]};

/* ---------- game setup ---------- */
function mk(x,face,c1,c2,maxv,name){return{x,y:F-13,vx:0,vy:0,a:0,face,color:c1,c2,maxv,name,boost:60,jumps:0,flip:0,fd:1,g:true,jcd:0,wr:0,fx:FL[0],body:0,tc:c1}}
function reset(){
 ball={x:W/2,y:200,vx:0,vy:0,rot:0,tr:[],col:'#bcd8ff',lock:null,tc:0,sp:7};
 const n=cfg.fmt=='2v2'?2:1,h=+cfg.nh;let t0,t1;
 if(n==1){t0=['H'];t1=[h==2?'H':'B']}
 else if(h==1){t0=['H','B'];t1=['B','B']}
 else if(h==2){const co=cfg.tm=='1';t0=co?['H','H']:['H','B'];t1=co?['B','B']:['H','B']}
 else if(h==3){t0=['H','H'];t1=['H','B']}
 else{t0=['H','H'];t1=['H','H']}
 let sl=0;cars=[];
 [t0,t1].forEach((t,ti)=>t.forEach((r,k)=>{
  const c=mk(ti?[700,820][k]:[200,80][k],ti?-1:1,ti?OR:CY,ti?'#e02c6d':'#0a6cff',4+3*D/100,'');
  c.team=ti;c.role=k;
  if(r=='H'){c.slot=sl++;c.maxv=7;c.tag='P'+sl;const q=GAR[c.slot];if(q.col){c.color=q.col;c.c2=dk(q.col)}c.body=q.body;c.fx=FL[q.fl]}else{c.slot=-1;c.tag='BOT'}
  cars.push(c);
 }));
 const bo=cars.every(c=>c.team==0||c.slot<0);
 TN=[n==1&&h==1?'TÚ':'AZUL',bo?(n==1?'BOT ':'BOTS ')+D:'NARANJA'];
}

/* ---------- particles ---------- */
function emit(x,y,n,col,s,life,sz,gv=0){
 for(let i=0;i<n;i++){const a=Math.random()*TAU,v=Math.random()*s;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*(.6+Math.random()*.4),m:life,c:col,s:sz*(.5+Math.random()),gv})}
 if(PT.length>600)PT.splice(0,PT.length-600);
}

/* ---------- physics ---------- */
function carStep(c,i){
 const w=64,h=26,vy0=c.vy;
 const bottom=c.y+Math.abs(Math.sin(c.a))*w/2+Math.abs(Math.cos(c.a))*h/2;
 if(bottom>=F-1&&c.vy>=0){
  c.y-=bottom-F;c.vy=0;
  if(!c.g){c.jumps=0;c.flip=0;if(vy0>4){emit(c.x,F,8,'#9fb4ff',2.5,22,3,.05);sfx(90,.08,'sine',.1)}}
  c.g=true;c.a-=Math.round(c.a/TAU)*TAU;c.a*=.7;if(Math.abs(c.a)<.01)c.a=0;
 }else c.g=false;
 if(i.dir&&c.g)c.face=i.dir;
 if(c.g){c.vx+=i.dir*.45;c.vx*=i.dir?.992:.97;c.wr+=c.vx*.12}
 else{c.vx*=.998;if(c.flip<=0)c.a+=i.dir*.07}
 if(c.flip>0){c.a+=c.fd*.35;c.flip--}
 if(i.jump){
  if(c.g){c.vy=-8.5;c.jumps=1;c.g=false;emit(c.x,F,6,'#9fb4ff',2,16,3,.05);sfx(300,.1,'square',.04,500)}
  else if(c.jumps<2){
   c.jumps=2;
   if(i.dir){c.vx+=i.dir*7;c.fd=i.dir;c.flip=18;c.vy=Math.min(c.vy,-1);c.face=i.dir;emit(c.x,c.y,14,c.color,5,20,3);sfx(400,.12,'sawtooth',.04,800)}
   else c.vy=-7;
  }
 }
 c.boosting=i.boost&&c.boost>0;
 if(c.boosting){
  c.boost-=.5;
  const nx=Math.cos(c.a)*c.face,ny=Math.sin(c.a)*c.face;
  c.vx+=nx*.5;c.vy+=ny*.5;
  for(let k=0;k<2;k++)PT.push({x:c.x-nx*34,y:c.y-ny*34,vx:-nx*(3+Math.random()*3)+Math.random()-.5,vy:-ny*(3+Math.random()*3)+Math.random()-.5,l:16,m:16,c:k?c.fx[0]:c.fx[1],s:6,gv:0});
  if(T%6==0)sfx(120+Math.random()*30,.08,'sawtooth',.02);
 }else c.boost=Math.min(100,c.boost+.08);
 if(c.g){const m=c.boosting?11:c.maxv;c.vx=Math.max(-m,Math.min(m,c.vx))}
 c.vx=Math.max(-13,Math.min(13,c.vx));
 c.vy+=.38;c.x+=c.vx;c.y+=c.vy;
 if(c.x<32){c.x=32;c.vx=0}if(c.x>W-32){c.x=W-32;c.vx=0}
 if(c.y<14){c.y=14;c.vy=0}
}
const HY=F-200,BK=()=>cfg.vr=='bask';
function hoops(){
 const b=ball;
 for(let s=0;s<2;s++){
  const xa=s?W-20:20,xb=s?W-130:130;
  for(const px of[xa,xb]){
   const dx=b.x-px,dy=b.y-HY,d=Math.hypot(dx,dy);
   if(d<R+4&&d>0){const nx=dx/d,ny=dy/d;b.x=px+nx*(R+4);b.y=HY+ny*(R+4);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;sfx(260,.06,'square',.05)}}
  }
  if(b.py<HY&&b.y>=HY&&b.vy>0&&b.x>Math.min(xa,xb)&&b.x<Math.max(xa,xb))goal(s==0?1:0);
 }
}
function touch(c){if(cfg.vr!='heat')return;const b=ball;b.lock=c.team==0?1:0;b.tc++;b.sp=Math.min(15,7+b.tc*.8)}
function hit(c){
 const w=64,h=26,ca=Math.cos(c.a),sa=Math.sin(c.a);
 const dx=ball.x-c.x,dy=ball.y-c.y;
 const lx=(dx*ca+dy*sa)*c.face,ly=-dx*sa+dy*ca;
 const cx=Math.max(-w/2,Math.min(w/2,lx)),cy=Math.max(-h/2,Math.min(h/2,ly));
 let nx=lx-cx,ny=ly-cy,d=Math.hypot(nx,ny);
 if(d>=R)return;
 if(d<.001){nx=0;ny=-1;d=0}else{nx/=d;ny/=d}
 const fx=nx*c.face,wx=fx*ca-ny*sa,wy=fx*sa+ny*ca;
 ball.x+=wx*(R-d);ball.y+=wy*(R-d);
 const vn=(ball.vx-c.vx)*wx+(ball.vy-c.vy)*wy;
 if(vn<0){
  const k=-1.6*vn+(c.flip>0?4:0)+(c.boosting?1.5:0);
  ball.vx+=wx*k+c.vx*.1;ball.vy+=wy*k+c.vy*.1;ball.col=c.color;touch(c);
  if(vn<-2){emit(ball.x-wx*R,ball.y-wy*R,12,c.color,4.5,18,3);sfx(160+Math.random()*60,.08,'square',.07);sh=Math.max(sh,Math.min(9,-vn*.8))}
 }
 const s=Math.hypot(ball.vx,ball.vy);if(s>18){ball.vx*=18/s;ball.vy*=18/s}
}
function ballStep(demo){
 const b=ball;
 if(b.lock!=null&&!demo){
  const gx=b.lock?W+OX/2:-OX/2,gy=F-GH/2,dx=gx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy)||1;
  b.sp=Math.min(16,b.sp*1.0006);
  b.vx+=(dx/d*b.sp-b.vx)*.05;b.vy+=(dy/d*b.sp-b.vy)*.05;
 }else{b.vy+=.22;b.vx*=.999}
 b.py=b.y;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vx/R;if(BK()&&!demo)hoops();
 b.tr.push(b.x,b.y);if(b.tr.length>32)b.tr.splice(0,2);
 if(b.y>F-R){b.y=F-R;if(b.vy>2.5)emit(b.x,F,4,'#9fb4ff',1.8,14,2);b.vy*=-.78;if(Math.abs(b.vy)<.8)b.vy=0;b.vx*=.99}
 if(b.y<R){b.y=R;b.vy*=-.8}
 if(!demo&&!BK()&&b.y>F-GH){
  if(b.x<-R)goal(1);else if(b.x>W+R)goal(0);
  if(b.x<-OX+R){b.x=-OX+R;b.vx*=-.4}
  if(b.x>W+OX-R){b.x=W+OX-R;b.vx*=-.4}
  if((b.x<0||b.x>W)&&b.y<F-GH+R){b.y=F-GH+R;b.vy=Math.abs(b.vy)*.5}
 }else{
  if(b.x<R){b.x=R;b.vx*=-.8}
  if(b.x>W-R){b.x=W-R;b.vx*=-.8}
 }
}
function goal(who){
 if(state!='play')return;
 score[who]++;state='goal';msgT=120;
 msg=BK()?(who==0?'¡CANASTA AZUL!':'¡CANASTA NARANJA!'):(who==0?'¡GOL AZUL!':'¡GOL NARANJA!');
 sh=24;fl=1;gl[who==0?1:0]=1;
 emit(who==0?W-70:70,BK()?HY:F-GH/2,100,who==0?CY:OR,9,70,4,.15);emit(W/2,F-60,60,'#ffd23a',8,70,4,.12);
 sfx(520,.6,'sawtooth',.08,120);sfx(880,.4,'square',.04,1320);

/* ---------- AI ---------- */
function aiInp(c){
 const bx=ball.x,by=ball.y,i={dir:0,jump:false,boost:false},s=c.team?1:-1;
 let tx=bx+s*((bx-c.x)*s>0?70:20)+(c.err||0);
 if(c.role==1&&(bx-W/2)*s<0)tx=W/2+s*W*.28;
 const dx=Math.max(50,Math.min(W-50,tx))-c.x;
 if(c.g){
  if(Math.abs(dx)>12)i.dir=Math.sign(dx);
  else c.face=Math.sign(bx-c.x)||c.face;
  i.boost=D>=20&&Math.abs(dx)>250&&c.boost>20;
  if(Math.hypot(bx-c.x,by-c.y)<160&&by<F-70&&Math.abs(bx-c.x)<110&&c.jcd<=0){i.jump=true;c.jcd=60}
 }else if(D>=35&&c.jumps==1&&Math.hypot(bx-c.x,by-c.y)<120&&c.jcd<45){
  i.jump=true;i.dir=Math.sign(bx-c.x)||-1;
 }else{
  const a=((c.a+Math.PI)%TAU+TAU)%TAU-Math.PI;
  i.dir=a>.1?-1:a<-.1?1:0;
 }
 return i;
}
function aiTick(c){
 if(!c.inp){c.inp={dir:0,jump:false,boost:false};c.rt=0}
 c.jcd--;
 if(--c.rt<=0){c.rt=Math.round(2+22*(1-D/100));c.err=(Math.random()-.5)*(1-D/100)*200;c.inp=aiInp(c)}
 const o={...c.inp};c.inp.jump=false;return o;
}

/* ---------- main step ---------- */
function step(){
 if(paused)return;T++;sh*=.88;fl*=.9;gl[0]*=.97;gl[1]*=.97;
 for(const q of PT){q.x+=q.vx;q.y+=q.vy;q.vy+=q.gv;q.l--}
 PT=PT.filter(q=>q.l>0);
 if(banT>0)banT--;
 if(state=='menu'||state=='over'){
  ballStep(true);
  if(ball.y>F-R-1&&Math.abs(ball.vx)<.6){ball.vx=(Math.random()-.5)*14;ball.vy=-11-Math.random()*4}
  JS.fill(false);return;
 }
 if(state=='replay'){
  ri+=.5;const f=RP[Math.min(RP.length-1,Math.floor(ri))];
  ball.x=f.b[0];ball.y=f.b[1];ball.rot=f.b[2];ball.tr.push(ball.x,ball.y);if(ball.tr.length>32)ball.tr.splice(0,2);
  cars.forEach((c,i)=>{const q=f.c[i];c.x=q[0];c.y=q[1];c.a=q[2];c.face=q[3];c.wr=q[4];c.boosting=!!q[5];if(q[5])emit(c.x-Math.cos(c.a)*c.face*34,c.y-Math.sin(c.a)*c.face*34,1,c.fx[1],2,12,5)});
  if(ri>=RP.length+10)endReplay();
  return;
 }
 if(state=='count'){
  cnt--;
  if(cnt>0&&cnt%40==0)sfx(440,.12,'square',.06);
  if(cnt<=0){state='play';goT=40;sfx(880,.3,'square',.07,1200)}
  JS.fill(false);return;
 }
 if(state=='goal'){
  ballStep(false);
  if(msgT>80)rec();if(--msgT<=0)startReplay();
  return;
 }
 cars.forEach(c=>{
  const sl=c.slot;let inp;
  if(sl<0)inp=aiTick(c);
  else{const a=KS[sl],b=cfg.nh==1?KS[1]:{};inp={dir:((a.r||b.r)?1:0)-((a.l||b.l)?1:0),jump:JS[sl]||(cfg.nh==1&&JS[1]),boost:a.b||b.b}}
  carStep(c,inp);
 });
 JS.fill(false);
 cars.forEach(c=>hit(c));ballStep(false);rec();
 if(T%3==0)HM[Math.min(24,Math.max(0,ball.y/20|0))*50+Math.min(49,Math.max(0,ball.x/18|0))]++;
 if(goT>0)goT--;
 if(state=='play'&&!ot&&--time<=0){
  if(score[0]==score[1]){ot=true;time=0;banT=150;sfx(300,.5,'sawtooth',.06,600)}
  else finish();
 }
}

  g.globalAlpha=1;g.strokeStyle='#ff7a2e';g.lineWidth=5;g.shadowColor='#ff7a2e';g.shadowBlur=14;
  g.beginPath();g.moveTo(x0+dr*8,HY);g.lineTo(x0+dr*130,HY);g.stroke();
  g.restore();
 }
}
function drawGoals(){
 if(BK()){drawHoops();return}
 for(let s=0;s<2;s++){
  const x0=s?W:-OX,col=s?OR:CY;
  g.save();g.globalAlpha=.1+.1*Math.sin(T*.08)+.6*gl[s];g.fillStyle=col;g.fillRect(x0,F-GH,OX,GH);
  g.globalAlpha=.25;g.strokeStyle='#fff';g.lineWidth=1;
  for(let i=0;i<=8;i++){g.beginPath();g.moveTo(x0+i*OX/8,F-GH);g.lineTo(x0+i*OX/8,F);g.stroke()}
  for(let i=0;i<=GH;i+=15){g.beginPath();g.moveTo(x0,F-GH+i);g.lineTo(x0+OX,F-GH+i);g.stroke()}
  g.restore();
  g.save();g.strokeStyle=col;g.lineWidth=5;g.shadowColor=col;g.shadowBlur=18;
  g.beginPath();g.moveTo(s?W+OX:-OX,F-GH);g.lineTo(s?W:0,F-GH);g.lineTo(s?W:0,F);g.stroke();g.restore();
 }
}
function drawBall(){
 const b=ball,n=b.tr.length/2;
 for(let i=0;i<n;i++){
  const f=i/n;g.globalAlpha=f*.3;g.fillStyle=b.col;g.beginPath();g.arc(b.tr[i*2],b.tr[i*2+1],R*f*.9,0,TAU);g.fill();
 }
 if(b.lock!=null){g.globalAlpha=.7;g.strokeStyle=b.col;g.lineWidth=3;g.beginPath();g.arc(b.x,b.y,R+7+Math.sin(T*.3)*3,0,TAU);g.stroke()}
 g.globalAlpha=1;g.save();g.translate(b.x,b.y);g.rotate(b.rot);
 g.shadowColor=b.col;g.shadowBlur=28;
 const gr=g.createRadialGradient(-6,-6,2,0,0,R);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#8fb0ff');
 g.fillStyle=gr;g.beginPath();g.arc(0,0,R,0,TAU);g.fill();g.shadowBlur=0;
 g.strokeStyle='#2a3a8a';g.lineWidth=3;g.beginPath();g.moveTo(-R,0);g.lineTo(R,0);g.moveTo(0,-R);g.lineTo(0,R);g.stroke();
 g.beginPath();g.arc(0,0,R*.55,0,TAU);g.stroke();g.restore();
}
function drawBar(x,w,c,col,right){
 rr(x,H-30,w,12,6,'rgba(8,12,32,.75)');
 const f=Math.max(0,c.boost/100),lowp=c.boost<15&&T%20<10;
 if(f>0){const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,lowp?'#ff3b3b':col);gr.addColorStop(1,'#fff');g.save();g.shadowColor=col;g.shadowBlur=8;rr(x+2,H-28,(w-4)*f,8,4,gr);g.restore()}
 tx(c.tag,right?x+w:x,H-40,10,col,null,right?'right':'left');
}
function drawHUD(){
 rr(500-175,10,350,58,16,'rgba(8,12,32,.78)');
 rr(500-175,10,115,58,[16,0,0,16],'rgba(37,217,255,.22)');rr(500+60,10,115,58,[0,16,16,0],'rgba(255,122,46,.22)');
 tx(TN[0],500-117,26,11,CY);tx(score[0],500-117,50,32,'#fff',CY);
 tx(TN[1],500+117,26,11,OR);tx(score[1],500+117,50,32,'#fff',OR);
 const s=Math.max(0,Math.ceil(time/60));
 tx(ot?'GOL DE ORO':Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),500,39,ot?13:24,s<=10&&!ot&&T%30<15?'#ff5a5a':'#fff');
 if(cfg.vr=='heat')tx('🔥 HEATSEEKER',500,84,13,'#ff9a4a','#ff5a1f');
 if(cfg.vr=='bask')tx('🏀 BALONCESTO',500,84,13,'#ffb347','#ff7a2e');
 if(state!='menu')cars.forEach(c=>{const t=c.team,k=cars.filter(d=>d.team==t).indexOf(c);drawBar(t?890-k*100:20+k*100,90,c,t?OR:CY,!!t)});
}
function draw(){
 g.save();
 if(sh>.3)g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
 g.drawImage(BG,0,0);
 const ex=state=='goal'||state=='over';
 for(const c of CR){g.globalAlpha=Math.min(1,.25+.25*Math.sin(T*(ex?.2:.05)+c.ph)+(ex?.35:0));g.fillStyle=c.c;g.fillRect(c.x,c.y-(ex?Math.abs(Math.sin(T*.2+c.ph))*6:0),3,3)}
 g.globalAlpha=1;g.globalCompositeOperation='lighter';
 for(const bx of[250,750]){const sw=Math.sin(T*.015+bx)*170;g.fillStyle=bx<500?'rgba(37,217,255,.05)':'rgba(255,122,46,.05)';g.beginPath();g.moveTo(bx,0);g.lineTo(bx+sw-50,F);g.lineTo(bx+sw+50,F);g.fill()}
 g.globalCompositeOperation='source-over';
 g.translate(OX,0);
 drawGoals();
 g.strokeStyle='#7b8cff';g.lineWidth=3;g.shadowColor='#7b8cff';g.shadowBlur=14;g.beginPath();g.moveTo(-OX,F);g.lineTo(W+OX,F);g.stroke();g.shadowBlur=0;
 drawBall();cars.forEach(drawCar);cars.forEach(c=>tx(c.tag,c.x,c.y-34,11,c.tc));
 g.globalCompositeOperation='lighter';
 for(const q of PT){const a=q.l/q.m;g.globalAlpha=a;g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,Math.max(.5,q.s*a),0,TAU);g.fill()}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 g.restore();
 if(fl>.02){g.globalAlpha=fl*.5;g.fillStyle='#fff';g.fillRect(0,0,1000,500);g.globalAlpha=1}
 if(state!='menu'&&state!='over'||state=='over')drawHUD();
 if(state=='count'){
  const n=Math.ceil(cnt/40),t=(cnt%40)/40||1;
  g.globalAlpha=.3+.7*t;tx(n,500,230,140*(1+(1-t)*.5),'#fff','#25d9ff');g.globalAlpha=1;
 }
 if(state=='play'&&goT>0){g.globalAlpha=Math.min(1,goT/20);tx('¡YA!',500,230,120+(40-goT)*2,'#ffd23a','#ff7a2e');g.globalAlpha=1}
 if(state=='replay'){
  g.fillStyle='rgba(70,30,140,.10)';g.fillRect(0,0,1000,500);g.fillStyle='#000';g.fillRect(0,H-44,1000,44);
  if(T%50<32)tx('⏪ REPETICIÓN',500,H-22,22,'#ffd23a','#ff7a2e');
  tx('Espacio o clic: saltar',980,H-22,12,'#9fb0ff',null,'right');
 }
 if(banT>0){g.globalAlpha=Math.min(1,banT/30);tx('¡PRÓRROGA!',500,170,64,'#ffd23a','#ff7a2e');g.globalAlpha=1}
 if(state=='goal'){
  const k=Math.min(1,(120-msgT)/18),sc=.4+.6*k+Math.sin(k*Math.PI)*.3;
  tx(msg,500,200,84*sc,'#ffd23a','#ff7a2e');
 }
}
function loop(t){
 acc+=Math.min(50,t-last);last=t;
 while(acc>=16.67){step();acc-=16.67}
 draw();if(ga)drawPrev();requestAnimationFrame(loop);
}
refresh();reset();requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
