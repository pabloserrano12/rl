<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor/a en prácticas: el cuerpo humano</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1ef;--card:#fff;--ink:#14213d;--mut:#5b6b7a;--acc:#0f8b8d;--ok:#2a9d5c;--bad:#c0392b;--line:#c3d3d0;--hot:#f4a300;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2b;--card:#182a40;--ink:#eaf2f0;--mut:#9fb3c2;--acc:#3cc5c7;--ok:#4cc07f;--bad:#ef6f61;--line:#2d4460;--hot:#ffc23d}}
:root[data-theme="dark"]{--bg:#0f1b2b;--card:#182a40;--ink:#eaf2f0;--mut:#9fb3c2;--acc:#3cc5c7;--ok:#4cc07f;--bad:#ef6f61;--line:#2d4460;--hot:#ffc23d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:14px;overflow-x:hidden}
main{width:100%;max-width:680px}
h1{font-size:2rem;font-weight:800;margin:4px 0;line-height:1.1}h2{margin:6px 0}
.sub{color:var(--mut);margin:0 0 18px}.sm{color:var(--mut);text-align:center;margin:8px 0;font-size:.9rem}
.hero{text-align:center;margin-bottom:8px}.av{font-size:2rem}.av.big{font-size:4rem;animation:bob 2s ease-in-out infinite}
.lv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;font:inherit;color:inherit;cursor:pointer;transition:transform .15s}
.lv:hover:not(:disabled){border-color:var(--acc);transform:translateY(-2px)}.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .ic{font-size:2rem}.lv b{font-size:1.1rem}.lv small{display:block;color:var(--mut)}.badge{margin-left:auto;font-weight:700;color:var(--acc);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;margin-bottom:4px}.top.s{font-size:.9rem;color:var(--mut)}
.bar,.tbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i,.tbar i{display:block;height:100%;background:var(--acc);transition:width .3s}.tbar i{background:var(--hot);width:100%}
.mas{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bub{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{display:flex;flex-direction:column;gap:8px}
.c{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:inherit;cursor:pointer;text-align:left;display:block;width:100%;transition:transform .1s}
.c:hover:not(:disabled){border-color:var(--acc)}.c:active{transform:scale(.97)}
.c.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--card))}
.c.done,.c.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}.c.done{opacity:.6;pointer-events:none}
.c.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 16px;text-align:center;font-size:1.35rem;font-weight:800;margin-bottom:14px;animation:pop .25s}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.bk .c{text-align:center;font-weight:700}
.opts{display:grid;gap:8px}.ph{width:100%;max-height:250px;object-fit:cover;border-radius:14px;margin-bottom:12px;border:2px solid var(--line)}
.seq{margin:0 0 12px;padding-left:24px;min-height:40px;font-weight:700;color:var(--ok)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .c{width:auto}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer;margin:6px 4px 0 0}.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.end{text-align:center;padding-top:20px}.big{font-size:4rem}
.cf{position:fixed;top:-40px;font-size:1.6rem;animation:fall 3s linear forwards;pointer-events:none}
.shake{animation:sh .35s}
@keyframes tb{to{width:0}}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.9);opacity:0}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><main id="app"></main>

const say=t=>{const m=$("#msg");if(m)m.textContent=t};
const shake=e=>{e.classList.add("shake");setTimeout(()=>e.classList.remove("shake"),400)};
function upd(){const L=LV[G.l];$("#hud").innerHTML=`<div class="top"><b>${L.e} ${L.t}</b><span>${"❤️".repeat(G.lives)+"🖤".repeat(3-G.lives)}</span></div><div class="top s"><span>⭐ ${G.xp} XP</span><span>${G.st>1?"🔥 racha x"+G.st:""}</span><span>Juego ${G.r+1}/${L.r.length}</span></div><div class="bar"><i style="width:${G.r/L.r.length*100}%"></i></div>`}
function hit(){G.st++;G.xp+=10+Math.min(G.st,5)*2;say(OK[Math.min(G.st,5)-1]||OK[4]);upd()}
function miss(){G.lives--;G.st=0;say(KO[Math.floor(Math.random()*3)]);upd();if(G.lives<=0){G.dead=1;setTimeout(fail,900)}}
function fin(){setTimeout(()=>{if(G.dead)return;G.r++;G.r>=LV[G.l].r.length?win():round()},400)}
function menu(){clearTimeout(TM);const S=P.s||[],tot=S.reduce((a,b)=>a+(b||0),0);
app.innerHTML=`<div class="hero"><div class="av big">🧑‍⚕️</div><h1>Doctor/a en prácticas</h1><p class="sub">Tema 1: el cuerpo humano. Supera los 4 niveles con minijuegos, gana XP y consigue las 12 estrellas.<br><b>⭐ ${tot}/12 · ${P.xp||0} XP</b></p></div>`+LV.map((l,i)=>{const o=i==0||S[i-1]>0;return `<button class="lv" ${o?"":"disabled"} data-i="${i}"><span class="ic">${l.e}</span><div><b>${l.n}: ${l.t}</b><small>${l.r.length} minijuegos${o?"":" · 🔒 supera el nivel anterior"}</small></div><span class="badge">${"⭐".repeat(S[i]||0)||(o?"Jugar":"")}</span></button>`}).join("");
app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function start(l){G={l,r:0,lives:3,xp:0,st:0,dead:0};round()}
function round(){clearTimeout(TM);const R=LV[G.l].r[G.r];app.innerHTML=`<div id="hud"></div><div class="mas"><span class="av">🧑‍⚕️</span><span id="msg" class="bub">${R.t}</span></div><div id="stage"></div>`;upd();({match,sort,order,tf,img})[R.k](typeof R.d=="function"?R.d():R.d,R,$("#stage"))}
function match(d,R,S){let sel=null,n=0;const A=sh(d.map((p,i)=>[p[0],i])),B=sh(d.map((p,i)=>[p[1],i])),h=(x,s)=>`<button class="c" data-s="${s}" data-i="${x[1]}">${x[0]}</button>`;
S.innerHTML=`<div class="two"><div>${A.map(x=>h(x,"l")).join("")}</div><div>${B.map(x=>h(x,"r")).join("")}</div></div>`;
S.querySelectorAll(".c").forEach(b=>b.onclick=()=>{if(G.dead)return;
if(b.dataset.s=="l"){S.querySelectorAll('[data-s=l]').forEach(x=>x.classList.remove("sel"));sel=b;b.classList.add("sel");return}
if(!sel){say("Elige primero uno de la izquierda");return}
if(sel.dataset.i==b.dataset.i){sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;hit();if(++n==d.length)fin()}
else{shake(b);sel.classList.remove("sel");sel=null;miss()}})}
function sort(d,R,S){const q=sh(d);let i=0;const show=()=>{S.innerHTML=`<div class="card">${q[i][0]}</div><div class="bk">${R.b.map((n,j)=>`<button class="c" data-j="${j}">${n}</button>`).join("")}</div><p class="sm">${i+1} de ${q.length}</p>`;
const bs=S.querySelectorAll(".c");bs.forEach(b=>b.onclick=()=>{if(G.dead)return;const ok=+b.dataset.j==q[i][1];bs.forEach(x=>x.disabled=true);
if(ok){b.classList.add("ok");hit()}else{b.classList.add("bad");bs[q[i][1]].classList.add("ok");miss()}
setTimeout(()=>{if(G.dead)return;++i>=q.length?fin():show()},ok?450:1100)})};show()}
function order(d,R,S){let n=0;S.innerHTML=`<ol class="seq" id="sq"></ol><div class="chips">${sh(d.map((t,i)=>[t,i])).map(x=>`<button class="c" data-i="${x[1]}">${x[0]}</button>`).join("")}</div>`;
S.querySelectorAll(".chips .c").forEach(b=>b.onclick=()=>{if(b.disabled||G.dead)return;
if(+b.dataset.i==n){b.disabled=true;b.classList.add("done");const li=document.createElement("li");li.textContent=b.textContent;$("#sq").appendChild(li);n++;hit();if(n==d.length)fin()}else{shake(b);miss()}})}
function tf(d,R,S){const q=sh(d).slice(0,8);let i=0;const show=()=>{S.innerHTML=`<div class="tbar"><i style="animation:tb 8s linear forwards"></i></div><div class="card">${q[i][0]}</div><div class="bk"><button class="c" data-v="1">✅ Verdadero</button><button class="c" data-v="0">❌ Falso</button></div><p class="sm">${i+1} de ${q.length}</p>`;
const go=v=>{clearTimeout(TM);if(G.dead)return;S.querySelectorAll("button").forEach(x=>x.disabled=true);const ok=v==q[i][1];ok?hit():miss();say(ok?"¡Correcto!":(v<0?"¡Tiempo! ":"")+"Era "+(q[i][1]?"verdadero":"falso"));TM=setTimeout(()=>{if(G.dead)return;++i>=q.length?fin():show()},1000)};
S.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go(+b.dataset.v));TM=setTimeout(()=>go(-1),8000)};show()}
function img(d,R,S){const q=sh(d);let i=0;const show=()=>{const [k,c,...w]=q[i];S.innerHTML=`<img class="ph" src="${IM[k]}" alt="Imagen del juego"><div class="opts">${sh([c,...w]).map(t=>`<button class="c">${t}</button>`).join("")}</div><p class="sm">${i+1} de ${q.length}</p>`;
const bs=S.querySelectorAll(".c");bs.forEach(b=>b.onclick=()=>{if(G.dead)return;bs.forEach(x=>{x.disabled=true;if(x.textContent==c)x.classList.add("ok")});if(b.textContent==c)hit();else{b.classList.add("bad");miss()}
setTimeout(()=>{if(G.dead)return;++i>=q.length?fin():show()},1100)})};show()}
function fail(){clearTimeout(TM);app.innerHTML=`<div class="end"><div class="big">💔</div><h2>¡Te has quedado sin vidas!</h2><p class="sub">Llevabas ${G.xp} XP. Repasa y vuelve a intentarlo.</p><button class="btn" id="a">Reintentar</button><button class="btn g" id="b">Menú</button></div>`;$("#a").onclick=()=>start(G.l);$("#b").onclick=menu}
function win(){clearTimeout(TM);const s=Math.max(1,G.lives);P.s=P.s||[];P.s[G.l]=Math.max(P.s[G.l]||0,s);P.xp=(P.xp||0)+G.xp;save();
for(let i=0;i<36;i++){const e=document.createElement("span");e.className="cf";e.textContent=["🎉","⭐","🧬","💊","🫀"][i%5];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
const last=G.l==LV.length-1;app.innerHTML=`<div class="end"><div class="big">🏆</div><h2>${last?"¡Eres doctor/a! Repaso completado":"¡Nivel superado!"}</h2><div class="big">${"⭐".repeat(s)}</div><p class="sub">+${G.xp} XP · ${G.lives} vidas restantes</p>${last?"":`<button class="btn" id="n">Siguiente nivel</button>`}<button class="btn g" id="m">Menú</button></div>`;
if(!last)$("#n").onclick=()=>start(G.l+1);$("#m").onclick=menu}
const app=$("#app");menu();
</script></body></html>
